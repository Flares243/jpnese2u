name: jpnese2u
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  window_manager:
    git:
      url: https://github.com/Flares243/window_manager
      ref: fix
      path: packages/window_manager
  mecab_for_dart:
    git:
      url: https://github.com/Flares243/mecab_for_dart.git
      ref: master
  platform_ocr:
    git:
      url: https://github.com/Flares243/platform_ocr.git
      ref: main
  tray_manager:
    git:
      url: https://github.com/Flares243/tray_manager.git
      ref: main
      path: packages/tray_manager
  sudachi_dart:
    path: /Users/chuongcao/code/flutter_plugins/sudachi_dart
  cupertino_icons: ^1.0.8
  google_mlkit_text_recognition: ^0.15.1
  flutter_macos_permissions: ^2.0.8
  permission_handler: ^12.0.3
  screen_capturer: ^0.2.3
  dio: ^5.10.0
  retrofit: ^4.9.2
  logger: ^2.7.0
  json_annotation: ^4.12.0
  envied: ^1.3.8
  dart_mappable: ^4.8.0
  get_it: ^8.0.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  desktop_multi_window: ^0.3.0
  path_provider: ^2.1.6
  pasteboard: ^0.5.0
  archive: ^4.0.9
  stretch_wrap: ^0.1.1
  copy_with_extension: ^15.0.1
  flutter_gen: ^5.15.0
  result_dart: ^2.2.0
  path: ^1.9.1
  file_picker: ^11.0.2
  http_status_code: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.14.1
  retrofit_generator: ^10.2.7
  envied_generator: ^1.3.8
  dart_mappable_builder: ^4.9.0
  json_serializable: ^6.14.0
  copy_with_extension_gen: ^15.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/tray_icon.png
    - assets/sudachi/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetBrains_mono.ttf

    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SF_Pro_Text_Ultralight.otf
          weight: 100
        - asset: assets/fonts/SF_Pro_Text_Thin.otf
          weight: 200
        - asset: assets/fonts/SF_Pro_Text_Light.otf
          weight: 300
        - asset: assets/fonts/SF_Pro_Text_Regular.otf
          weight: 400
        - asset: assets/fonts/SF_Pro_Text_Medium.otf
          weight: 500
        - asset: assets/fonts/SF_Pro_Text_Semibold.otf
          weight: 600
        - asset: assets/fonts/SF_Pro_Text_Bold.otf
          weight: 700
        - asset: assets/fonts/SF_Pro_Text_Heavy.otf
          weight: 800
        - asset: assets/fonts/SF_Pro_Text_Black.otf
          weight: 900

    - family: BIZUDPGothic
      fonts:
        - asset: assets/fonts/BIZUDPGothic-Regular.ttf
        - asset: assets/fonts/BIZUDPGothic-Bold.ttf
          weight: 700

    - family: Noto Sans Symbols 2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf

    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Thin.ttf
          weight: 100
        - asset: assets/fonts/NotoSansJP-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/NotoSansJP-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansJP-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansJP-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/NotoSansJP-Black.ttf
          weight: 900
